name: Test BMI

on:
  push:
    branches: [main]
    paths:
      - app.py
      - serve.py
      - requirements.txt
      - templates/**
      - static/**
      - tests/**
      - .github/workflows/deploy-azure-test.yml
  pull_request:
    paths:
      - app.py
      - serve.py
      - requirements.txt
      - templates/**
      - static/**
      - tests/**
      - .github/workflows/deploy-azure-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m unittest discover -s tests
